[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "veilforge"
version = "0.1.0"
description = "A modular Python steganography toolkit."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "cryptography==50.0.0",
    "Pillow==12.3.0",
    "typer",
]


[project.scripts]
veilforge = "main:app"


[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = [
    "core*",
    "crypto*",
    "image_stego*",
    "storage*",
    "utils*",
]